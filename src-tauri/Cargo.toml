[package]
name = "the-fawns-story"
version = "1.0.0"
description = "The Fawn's Story — Season 1: Bloody Tour"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
