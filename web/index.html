<meta charset="utf-8">
<title>The Fawn's Story</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fixed 1920×1200 "table" stage scaled to fit; every layer sits at stage-pixel coordinates taken from the author's mockups. */
@font-face{font-family:"Mister Brush";src:url("fonts/MisterBrush.otf") format("opentype");font-display:block}
@font-face{font-family:"Dirty Harold";src:url("fonts/DirtyHarold.otf") format("opentype");font-display:block}
:root{
  --ground:#2f2d2b;      /* concrete under the stage */
  --ink:#0b0a09;         /* outlines, silhouettes */
  --paper:#efe9dd;       /* hand-lettered text */
  --paper-dim:#a8a197;
  --played:#b9b5ae;      /* listened part of the timeline */
  --track:#1d1c1a;
  --line:#9fb3cf;        /* notebook ruling */
  --brush:"Mister Brush","Marker Felt","Comic Sans MS",cursive;
  --harold:"Dirty Harold","Mister Brush","Marker Felt",cursive; /* universe lettering, Latin only */
  --night:#000;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--paper);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  font-family:var(--brush);-webkit-tap-highlight-color:transparent}
#viewport{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1200px;transform-origin:center;overflow:hidden;
  background:url("img/bg.webp") 0 0/1920px 1200px}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(0,0,0,.55);z-index:30}
.L{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hide{opacity:0!important}
.stroke{paint-order:stroke fill;-webkit-text-stroke:var(--sw,6px) var(--ink)}
.scr{position:absolute;inset:0;transition:opacity .6s ease}
body:not([data-screen="seasons"]):not([data-screen="splash"]) #seasons,
body:not([data-screen="play"]) #player{opacity:0;pointer-events:none}
button{font-family:var(--brush)}
:focus-visible{outline:3px solid var(--paper);outline-offset:4px}

/* ---------- universe splash: the same scene as the seasons menu, framed closer (6.png = 2.png × 1.136) ---------- */
body[data-screen="splash"],body[data-screen="seasons"]{background:var(--night)}
#splash{position:absolute;inset:0;z-index:40;cursor:pointer;transition:opacity .6s ease}
#splash .hint{position:absolute;left:0;right:0;top:960px;text-align:center;font-size:44px;letter-spacing:.06em;opacity:0;animation:in .8s 1s forwards, pulse 2.4s 1.8s ease-in-out infinite}
#splash .sub{position:absolute;left:0;right:0;top:1026px;text-align:center;font-size:28px;color:var(--paper-dim);opacity:0;animation:in .8s 1.2s forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes pulse{50%{opacity:.45}}
body:not([data-screen="splash"]) #splash{opacity:0;pointer-events:none}

/* ---------- season menu: the Bloody Tour logo assembles, then the two sections appear ---------- */
#intro{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .5s}
body[data-screen="season"] #intro{opacity:1;pointer-events:auto}
#intro .tfs{left:561px;top:70px;width:798px;opacity:0;transform:scale(.96)}
#intro .bt{left:566px;top:468px;width:814px;clip-path:inset(0 100% 0 0)}
#intro.run .tfs{animation:in 1.1s .15s ease forwards}
#intro.run .bt{animation:wipe 1s 1.1s cubic-bezier(.6,0,.3,1) forwards}
#intro.done .tfs{opacity:1;transform:none;animation:none}
#intro.done .bt{clip-path:inset(0 0 0 0);animation:none}
#secBtns{position:absolute;left:0;right:0;top:810px;display:flex;justify-content:center;gap:58px}
.secBtn{position:relative;font:60px/1 var(--brush);color:var(--paper);background:none;border:0;cursor:pointer;padding:10px 24px;--sw:10px;opacity:0;transform:translateY(24px);transition:color .2s,text-shadow .2s}
#intro.run .secBtn{animation:in .7s 2.1s ease forwards}
#intro.run .secBtn+.secBtn{animation-delay:2.3s}
#intro.run .secBtn+.secBtn+.secBtn{animation-delay:2.5s}
#intro.run .secBtn+.secBtn+.secBtn+.secBtn{animation-delay:2.7s}
#intro.run .secBtn+.secBtn+.secBtn+.secBtn+.secBtn{animation-delay:2.9s}
#intro.done .secBtn{opacity:1;transform:none;animation:none}
.secBtn:hover,.secBtn:focus-visible{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.55);outline:none}
.secBtn::after{content:"";position:absolute;right:-64px;top:50%;width:62px;height:64px;margin-top:-34px;background:url("img/anarchy.webp") center/contain no-repeat;opacity:0;transition:opacity .15s}
.secBtn:hover::after,.secBtn:focus-visible::after{opacity:1}
#secNote{position:absolute;left:0;right:0;top:960px;text-align:center;font-size:40px;--sw:6px;opacity:0;transition:opacity .4s}
#secNote.on{opacity:1}
#menuBack{position:absolute;left:0;top:0;z-index:6;font-size:38px;color:var(--paper);background:rgba(20,19,18,.55);border:0;padding:16px 26px 16px 18px;cursor:pointer;--sw:5px}
#menuBack:hover,#menuBack:focus-visible{background:rgba(20,19,18,.85)}
#fader{position:absolute;inset:0;background:var(--night);z-index:35;opacity:0;pointer-events:none;transition:opacity .42s ease}
#fader.on{opacity:1;pointer-events:auto}

/* ---------- global corner buttons ---------- */
.icon-btn{position:absolute;z-index:26;background:none;border:0;padding:0;cursor:pointer;transition:transform .15s,opacity .4s}
.icon-btn:hover{transform:scale(1.08)}
#home{right:18px;top:12px;width:84px;height:84px}
#home svg{width:100%;height:100%}
#rai{right:16px;bottom:44px;width:86px;height:88px}
#rai img{width:100%;height:100%;filter:drop-shadow(0 0 2px var(--ink))}
#rai[aria-expanded="true"]{transform:rotate(-14deg)}
body[data-screen="splash"] #rai,body[data-screen="splash"] #home,body[data-screen="seasons"] #home{opacity:0;pointer-events:none}

/* ---------- Telegram note ---------- */
#tg{position:absolute;right:0;bottom:0;width:540px;height:560px;z-index:25;
  background:
    radial-gradient(circle at calc(100% - 22px) 50%,var(--ink) 0 9px,transparent 10px) right top/44px 58px repeat-y,
    repeating-linear-gradient(to bottom,transparent 0 56px,var(--line) 56px 58px) 0 34px/100% 100% no-repeat,
    #f4f1ea;
  clip-path:polygon(0 3%,3% 0,9% 2%,15% 0,22% 1.5%,30% 0,38% 2%,46% .5%,55% 2%,63% 0,71% 1.8%,80% .3%,88% 2%,95% 0,100% 1%,100% 100%,1% 100%,2% 92%,0 85%,1.5% 77%,0 69%,2% 60%,.5% 52%,2% 44%,0 36%,1.8% 28%,0 20%,2% 12%);
  transform:translateY(110%) rotate(3deg);transform-origin:100% 100%;transition:transform .55s cubic-bezier(.3,1.3,.5,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 64px 70px 30px;box-sizing:border-box}
#tg.open{transform:none}
#tg h2{margin:0 0 6px;font-size:58px;font-weight:400;line-height:1;--sw:9px;text-align:center}
#tg a{font-size:44px;color:var(--paper);text-decoration:none;--sw:8px;line-height:1.1}
#tg .vol{font-size:40px;--sw:8px;margin-top:22px;line-height:1}
#vol{-webkit-appearance:none;appearance:none;width:360px;height:44px;background:transparent;cursor:pointer;margin:0}
#vol::-webkit-slider-runnable-track{height:24px;border-radius:12px;background:linear-gradient(90deg,var(--played) var(--v,80%),var(--track) var(--v,80%));box-shadow:inset 0 0 0 4px var(--ink)}
#vol::-moz-range-track{height:24px;border-radius:12px;background:linear-gradient(90deg,var(--played) var(--v,80%),var(--track) var(--v,80%));box-shadow:inset 0 0 0 4px var(--ink)}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-7px;border-radius:50%;background:var(--ink);border:5px solid var(--paper)}
#vol::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--ink);border:5px solid var(--paper)}
#vol:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
#tg a:hover,#tg a:focus-visible{color:#ffd9d9}

/* ---------- seasons ---------- */
#seasons{background:var(--night)}
#scene{position:absolute;left:0;top:0;width:1920px;height:1200px;transform-origin:0 0;transition:transform 2.6s cubic-bezier(.65,0,.25,1)}
body[data-screen="splash"] #scene{transform:translate(-130.4px,85.2px) scale(1.136)}
#scene .bg{left:0;top:0;width:1920px;height:1200px}
#deer{left:643px;top:140px;width:635px;height:552px;animation:breathe 6s ease-in-out infinite, glitch 9s steps(1) infinite}
@keyframes breathe{50%{filter:brightness(1.2)}}
#deerHit{position:absolute;left:779px;top:175px;width:346px;height:427px;background:none;border:0;padding:0;cursor:pointer;border-radius:40%}
body:not([data-screen="seasons"]) #deerHit{pointer-events:none}
#deer.jolt{animation:jolt .6s steps(1) 1}
@keyframes jolt{0%{transform:translate(12px,0) skewX(-5deg);filter:brightness(1.7)}10%{transform:translate(-16px,3px);filter:brightness(.55)}20%{transform:translate(7px,-7px) skewX(4deg);filter:brightness(1.5)}30%{transform:translate(-5px,9px);opacity:.55}42%{transform:translate(14px,0) scaleY(1.04);filter:brightness(1.9);opacity:1}54%{transform:translate(-7px,-3px);filter:brightness(.8)}66%{transform:translate(4px,1px) skewX(-2deg);filter:brightness(1.3)}80%{transform:translate(-2px,0)}90%,100%{transform:none;filter:none}}
@keyframes glitch{0%,90%,100%{transform:none;opacity:1}91%{transform:translateX(6px);opacity:.82}92%{transform:translateX(-4px);opacity:.95}93%{transform:translateX(2px)}94%{transform:none}}
#scan{position:absolute;left:643px;top:140px;width:635px;height:552px;overflow:hidden;pointer-events:none;mix-blend-mode:screen;
  -webkit-mask:url("img/deer.webp") 0 0/100% 100%;mask:url("img/deer.webp") 0 0/100% 100%;mask-mode:luminance}
#scan::before{content:"";position:absolute;left:0;right:0;top:-90px;height:70px;background:linear-gradient(transparent,rgba(255,255,255,.55),transparent);animation:track 7s linear infinite}
@keyframes track{0%{transform:translateY(0)}55%,100%{transform:translateY(820px)}}
.season{position:absolute;top:689px;width:301px;height:301px;background:none;border:0;padding:0;cursor:pointer;opacity:0;transform:translateY(46px);
  transition:opacity .8s ease calc(var(--d,0s) + var(--i)*.13s),transform .8s cubic-bezier(.3,.7,.3,1) calc(var(--d,0s) + var(--i)*.13s)}
body[data-screen="seasons"] .season{opacity:1;transform:none}
body:not([data-screen="seasons"]) .season{pointer-events:none}
.season .face{position:relative;width:301px;height:301px;transition:transform .25s ease,box-shadow .25s ease}
.season .face img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.season:hover .face,.season:focus-visible .face{transform:translateY(-12px);box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 36px rgba(255,255,255,.3),0 20px 30px rgba(0,0,0,.7)}
.season:focus-visible{outline:none}
.season.locked{cursor:not-allowed}
.season.locked .face::after{content:"";position:absolute;inset:22px;background:rgba(0,0,0,.66)}
.season.locked .face svg{position:absolute;left:50%;top:50%;width:46%;transform:translate(-50%,-52%);z-index:1}
.season .lbl{position:absolute;left:-70px;right:-70px;top:336px;font:57px/60px var(--harold);color:#fff;text-align:center;white-space:nowrap;pointer-events:none}
.season.shake .face{animation:shake .45s}

/* ---------- cassette menu ---------- */
#stack{left:131px;top:56px;width:675px;height:1108px;transition:transform .9s cubic-bezier(.7,0,.3,1),opacity .6s}
#stack img{position:absolute;inset:0;width:100%;height:100%}
#stackOld{transition:opacity 1.6s ease}
#mark{left:813px;width:80px;height:82px;transition:top .18s ease,opacity .15s;opacity:0;z-index:3}
#rows{position:absolute;left:131px;top:56px;width:762px;height:1108px;z-index:4}
#rows button{position:absolute;left:0;width:100%;background:none;border:0;padding:0;cursor:pointer;outline:none}
#rows button[data-state="locked"]{cursor:not-allowed}
#panel{left:978px;top:157px;width:885px;height:886px;transition:opacity .6s}
#panel img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s ease}
#panel.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
#note{position:absolute;left:978px;width:885px;top:1066px;text-align:center;font-size:38px;line-height:1.15;--sw:6px;transition:opacity .4s;opacity:0;z-index:5}
#note.on{opacity:1}
#reset{position:absolute;left:990px;top:1150px;z-index:6;font-size:26px;color:var(--paper-dim);background:none;border:0;cursor:pointer;opacity:.55;padding:0}
#reset:hover,#reset:focus-visible{opacity:1;color:var(--paper)}
#reset[data-confirm]{color:#e86a6a;opacity:1}
body:not([data-screen="menu"]) #reset,body:not([data-screen="menu"]) #rows,body:not([data-screen="menu"]) #menuBack{display:none}
body:not([data-screen="menu"]) #stack,body:not([data-screen="menu"]) #mark{transform:translateX(-900px);opacity:0}
body:not([data-screen="menu"]) #panel{opacity:0;transition:opacity .25s}
body:not([data-screen="menu"]) #note{opacity:0}

/* ---------- player ---------- */
#back{position:absolute;left:0;top:0;z-index:6;font-size:38px;color:var(--paper);background:rgba(20,19,18,.55);border:0;padding:16px 26px 16px 18px;cursor:pointer;--sw:5px}
#back:hover,#back:focus-visible{background:rgba(20,19,18,.85)}
#ptitle{position:absolute;left:400px;right:400px;top:16px;text-align:center;font-size:46px;line-height:1.1;--sw:8px;text-transform:uppercase}
#tape{left:290px;top:150px;width:460px;height:819px;transform:translateX(-900px) rotate(-4deg);opacity:0;transition:transform .9s cubic-bezier(.3,.6,.2,1),opacity .6s}
body[data-screen="play"][data-phase="tape"] #tape{transform:rotate(-2deg);opacity:1}
#epi{left:136px;top:420px;width:774px;height:340px;opacity:0;transform:translateY(30px) rotate(-3deg);transition:opacity .8s,transform .9s ease}
body[data-screen="play"][data-phase="epi"] #epi{opacity:1;transform:rotate(-1deg)}
#subs{position:absolute;left:30px;width:1000px;top:300px;height:580px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;
  font-size:46px;line-height:1.24;text-transform:uppercase;text-wrap:balance;--sw:9px;opacity:0;transition:opacity .25s}
body[data-phase="story"] #subs.on{opacity:1}
#subs .en{color:#fff}

#coverBox{position:absolute;left:978px;top:157px;width:885px;height:886px;transition:left 1s cubic-bezier(.6,0,.25,1),top 1s,width 1s,height 1s;z-index:5}
body[data-screen="play"] #coverBox{left:1035px;top:138px;width:862px;height:863px}
#cover{position:absolute;inset:0;width:100%;height:100%}
#shade{position:absolute;inset:4.5%;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s;pointer-events:none}
#ctrls{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:34px;opacity:0;transition:opacity .25s;pointer-events:none}
#coverBox:hover #shade,#coverBox:hover #ctrls,#coverBox.show #shade,#coverBox.show #ctrls,#coverBox:focus-within #shade,#coverBox:focus-within #ctrls{opacity:1;pointer-events:auto}
.cb{width:92px;height:92px;border-radius:50%;background:var(--ink);border:5px solid var(--paper);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .15s}
.cb:hover{transform:scale(1.08)}
.cb svg{width:38%;height:38%;fill:var(--paper)}
.cb.big{width:132px;height:132px}
.cb .ten{position:absolute;font-size:22px;margin-top:84px;color:var(--paper);--sw:4px}
.cb{position:relative}

#timeline{position:absolute;left:104px;top:1046px;width:1690px;height:56px}
#tl-track{position:absolute;inset:0;border-radius:28px;background:var(--track);box-shadow:inset 0 0 0 7px var(--ink),0 4px 12px rgba(0,0,0,.4);overflow:hidden}
#tl-played{position:absolute;left:7px;top:7px;bottom:7px;border-radius:21px;background:var(--played);width:0}
#car{position:absolute;bottom:-10px;width:312px;height:106px;margin-left:-156px;left:0;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
#seek{position:absolute;left:-20px;right:-20px;top:-40px;bottom:-14px;width:calc(100% + 40px);height:auto;opacity:0;cursor:pointer;margin:0}
#timeline:has(#seek:focus-visible) #tl-track{box-shadow:inset 0 0 0 7px var(--ink),0 0 0 4px var(--paper)}
#time{position:absolute;left:0;right:0;top:1112px;text-align:center;font-size:40px;--sw:6px;font-variant-numeric:tabular-nums}

/* ---------- video (bonus episodes) + credits ---------- */
#vid{position:absolute;left:0;top:0;width:1920px;height:1200px;object-fit:contain;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4}
body[data-phase="video"] #vid{opacity:1;pointer-events:auto;cursor:pointer}
body[data-phase="video"] #coverBox{opacity:0;pointer-events:none}
body[data-phase="video"] #subs{left:160px;width:1600px;top:790px;height:190px;justify-content:flex-end;z-index:5;transition:opacity .25s,top .4s ease}
body[data-phase="video"].idle #subs{top:930px}
body[data-phase="video"] #subs.on{opacity:1}
body[data-phase="video"] #back,body[data-phase="video"] #ptitle,body[data-phase="video"] #timeline,body[data-phase="video"] #time{z-index:6;transition:opacity .4s}
body[data-phase="video"].idle #back,body[data-phase="video"].idle #ptitle,body[data-phase="video"].idle #timeline,body[data-phase="video"].idle #time,
body[data-phase="video"].idle #home,body[data-phase="video"].idle #rai{opacity:0;pointer-events:none}
body[data-phase="video"].idle #vid{cursor:none}
#credits{position:absolute;inset:0;z-index:33;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
body[data-screen="credits"] #credits{opacity:1;pointer-events:auto}
#credVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#skipCredits{position:absolute;right:48px;bottom:44px;font-size:40px;color:var(--paper);background:rgba(20,19,18,.6);border:3px solid var(--paper);border-radius:8px;padding:12px 28px;cursor:pointer;--sw:5px;opacity:.75;transition:opacity .2s}
#skipCredits:hover,#skipCredits:focus-visible{opacity:1}
body[data-screen="credits"] #rai,body[data-screen="credits"] #home{opacity:0;pointer-events:none}

#rotate{position:fixed;inset:auto 0 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));text-align:center;
  font:22px var(--brush);color:var(--paper);background:rgba(11,10,9,.8);display:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

/* ---------- characters: concrete wall + notebook page ---------- */
@font-face{font-family:"Caveat";src:url("fonts/Caveat.woff") format("woff");font-weight:400 700;font-display:swap}
#chars{position:absolute;inset:0;z-index:21;opacity:0;pointer-events:none;transition:opacity .5s;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)),#141312 url("img/wall.webp") 0 0/1920px 1200px}
body[data-screen="chars"] #chars{opacity:1;pointer-events:auto}
#wall{position:absolute;inset:0;transition:opacity .4s}
.wlabel{position:absolute;font:46px/1 var(--brush);color:rgba(239,233,221,.34);letter-spacing:2px;transform:rotate(-2deg);pointer-events:none}
.pst{position:absolute;top:128px;width:280px;height:373px;padding:0;border:0;background:none;cursor:pointer;transform:rotate(var(--r));transition:transform .25s}
.pst::before{content:"";position:absolute;inset:-150px -130px -230px;background:radial-gradient(closest-side,rgba(255,236,210,.16),transparent);opacity:0;transition:opacity .3s;z-index:-1;pointer-events:none}
.pst img{display:block;width:100%;height:100%;filter:brightness(.42) saturate(.6);box-shadow:0 12px 26px rgba(0,0,0,.65);transition:filter .3s}
.pst .wn{position:absolute;left:-40px;right:-40px;top:398px;text-align:center;font:50px/1 var(--brush);color:rgba(239,233,221,.5);transition:color .25s,text-shadow .25s;transform:rotate(calc(var(--r) * -1))}
.pst:hover,.pst:focus-visible{transform:rotate(var(--r)) translateY(-6px);outline:none}
.pst:hover::before,.pst:focus-visible::before{opacity:1}
.pst:hover img,.pst:focus-visible img{filter:none}
.pst:hover .wn,.pst:focus-visible .wn,.wname:hover,.wname:focus-visible{color:var(--c);text-shadow:0 0 16px var(--c),0 0 42px var(--c),0 2px 0 #000;outline:none}
.wlist{position:absolute;top:720px;width:780px}
.wname{display:block;position:relative;margin:0 0 30px var(--x);padding:0 6px;font:58px/1 var(--brush);color:rgba(239,233,221,.48);background:none;border:0;cursor:pointer;transform:rotate(var(--r));transition:color .25s,text-shadow .25s;white-space:nowrap}
.wname.locked{color:transparent!important;text-shadow:none!important;cursor:help}
.wname.locked::after{content:"";position:absolute;left:-4px;right:-8px;top:8px;bottom:2px;background:#0b0a09;border-radius:6px 14px 5px 11px/9px 5px 12px 6px;box-shadow:3px 2px 0 -1px #0b0a09,-5px -2px 0 -2px #1a1816}
#wallNote{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:38px;--sw:6px;opacity:0;transition:opacity .3s;pointer-events:none}
#wallNote.on{opacity:1}

  try{navigator.mediaSession.metadata=new MediaMetadata({title:e.title,artist:"The Fawn's Story",album:"Season 1 · Bloody Tour",artwork:[{src:e.art,sizes:"512x512",type:"image/jpeg"}]})}catch(_){}
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(_){}};

/* a video episode may be split into parts (hosting limit); they play back as one timeline */
let segs=null,segI=0,segOff=[0];
function mTime(){return segs?segOff[segI]+(vid.currentTime||0):(media.currentTime||0)}
function mDur(){return segs?segOff[segs.length]:(media.duration||0)}
function loadSeg(k,at,play){segI=k;vid.src=MEDIA(segs[k].src);
  vid.addEventListener("loadedmetadata",()=>{vid.currentTime=Math.max(0,at);if(play)vid.play().catch(()=>{})},{once:true})}
function mSeek(t){const d=mDur();t=Math.max(0,Math.min(d?d-0.05:t,t));
  if(!segs){media.currentTime=t;return}
  let k=segs.length-1;while(k>0&&t<segOff[k])k--;
  if(k!==segI)loadSeg(k,t-segOff[k],!vid.paused||videoOn);else vid.currentTime=t-segOff[k]}

  $("ptitle").innerHTML=`The Fawn's Story<br>Season 1 - ${e.bonus?"Bonus Episode #"+(i-9):"Episode "+(i+1)} - ${e.title}`;
  $("tape").src=`img/tape_${e.tape}.webp`;$("epi").src=e.epi?`img/epi_${e.epi}.webp`:"";$("cover").src=`img/cover_${e.cover}.webp`;

  const cb=$("coverBox");cb.hidden=false;void cb.offsetWidth;

  audio.pause();vid.pause();media=e.video?vid:audio;videoOn=false;setMeta(i);const resume=save.pos[i]||0;
  segs=Array.isArray(e.video)?e.video:null;
  if(segs){segOff=[0];segs.forEach(s=>segOff.push(segOff[segOff.length-1]+s.dur));
    let k=segs.length-1;while(k>0&&resume<segOff[k])k--;
    loadSeg(resume>5&&resume<mDur()-5?k:0,resume>5&&resume<mDur()-5?resume-segOff[k]:0,false)}
  else{media.src=MEDIA(e.video||e.audio);
    media.addEventListener("loadedmetadata",()=>{if(resume>5&&resume<media.duration-5)media.currentTime=resume},{once:true})}
  musicOff();clearTimeout(vidT);

  else setTimeout(()=>media.play().catch(()=>{}),900);

/* keyboard */
addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("evNote").classList.contains("on")){closeNote();return}
  if(ev.key==="Escape"&&$("ach").classList.contains("on")){achClose();return}
  if(ev.key==="Escape"&&$("tg").classList.contains("open")){closeTg();return}
  const sc=body.dataset.screen;
  if(sc==="splash"&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();start();return}
  if(sc==="art"&&ev.target.tagName==="INPUT")return;
  if(sc==="art"){const lb=$("lb").classList.contains("on");
    if(ev.key==="Escape"){lb?closeLb():showSeason();return}
    if(ev.key==="ArrowLeft"){lb?lbStep(-1):albStep(-1);return}
    if(ev.key==="ArrowRight"){lb?lbStep(1):albStep(1);return}}
  if(sc==="fc"&&ev.key==="Escape"){showSeason();return}
  if(sc==="fcplay"){const onB=/BUTTON|A/.test(ev.target.tagName),onS=ev.target.id==="fcSeek";
    if(ev.key==="Escape"){fcToList();return}
    if(ev.key===" "&&!onB){ev.preventDefault();fcToggle();return}
    if(!onS&&ev.key==="ArrowLeft"){fcA.currentTime=Math.max(0,fcA.currentTime-10);return}
    if(!onS&&ev.key==="ArrowRight"){fcA.currentTime=Math.min(fcA.duration||0,fcA.currentTime+10);return}}
  if(sc==="map"&&ev.key==="Escape"){$("pop").classList.contains("on")?hidePop(true):showSeason();return}
  if(sc==="chars"&&ev.key==="Escape"){$("chars").classList.contains("page")?closeChar():showSeason();return}
  if(sc!=="play")return;
  const onBtn=/BUTTON|A/.test(ev.target.tagName),onSeek=ev.target.id==="seek";
  if(ev.key===" "&&!onBtn){ev.preventDefault();armedAt=0;toggle()}
  if(!onSeek&&ev.key==="ArrowLeft")skip(-10);
  if(!onSeek&&ev.key==="ArrowRight")skip(10);
  if(ev.key==="Escape")leave(false,"menu");
});

  save={done:0,pos:{},vol:save.vol,ach:{}};persist();setStack(false);refreshRows();hover(-1);note("Прогресс сброшен")});

/* splash */
/* ---------- background soundtrack + master volume ---------- */
const music=$("music"),MUSIC_GAIN=.45; // the OST is ~11 dB hotter than the episodes
let mLevel=0,fadeRaf=0;
function setVols(){const m=Math.max(0,Math.min(1,+save.vol||0));if(typeof fcA!=="undefined")fcA.volume=m;music.volume=Math.max(0,Math.min(1,m*MUSIC_GAIN*mLevel));audio.volume=m;vid.volume=m;const cv=document.getElementById("credVid");if(cv)cv.volume=m}
function fadeTo(target,ms,done){cancelAnimationFrame(fadeRaf);const from=mLevel,t0=performance.now();
  const step=now=>{const k=Math.max(0,Math.min(1,(now-t0)/ms));mLevel=from+(target-from)*k;setVols();if(k<1)fadeRaf=requestAnimationFrame(step);else if(done)done()};
  fadeRaf=requestAnimationFrame(step)}
function musicOn(){if(music.paused)music.play().catch(()=>{});fadeTo(1,1800)}
function musicOff(){fadeTo(0,900,()=>music.pause())}
const vol=$("vol"),showVol=()=>vol.style.setProperty("--v",(save.vol*100)+"%");
vol.value=Math.round(save.vol*100);showVol();setVols();
vol.addEventListener("input",()=>{save.vol=vol.value/100;showVol();setVols();persist()});

function start(){if(body.dataset.screen!=="splash")return;$("seasons").style.setProperty("--d","1.5s");go("seasons")}
$("splash").addEventListener("click",start);
body.dataset.screen="splash";setStack(false);refreshRows();
</script>
